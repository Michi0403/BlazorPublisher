name: Publish PublisherStudio Kawaii documentation

on:
  push:
    paths:
      - '.github/workflows/publish-shipped-docs.yml'
      - '.github/scripts/prepare-pages-artifact.py'
      - '.github/pages/publisherstudio-kawaii-docs.zip'
      - 'src/PublisherStudio.Web/PublisherStudio.Web.csproj'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publisherstudio-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Kawaii documentation
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing snapshot
        uses: actions/checkout@v6

      - name: Require GitHub Actions as the Pages publishing source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(printf '%s' "$pages_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_type") or "legacy")')"
          source_branch="$(printf '%s' "$pages_json" | python3 -c 'import json,sys; d=json.load(sys.stdin).get("source") or {}; print(d.get("branch") or "")')"
          source_path="$(printf '%s' "$pages_json" | python3 -c 'import json,sys; d=json.load(sys.stdin).get("source") or {}; print(d.get("path") or "")')"
          echo "PublisherStudio Pages build_type=$build_type source=${source_branch}${source_path}"
          if [[ "$build_type" != "workflow" ]]; then
            echo "PublisherStudio Pages is still configured for legacy branch publishing (${source_branch}${source_path})." >&2
            echo "That GitHub-managed pages-build-deployment Jekyll job can overwrite this DocFX artifact after a successful custom deployment." >&2
            echo "Change Repository Settings -> Pages -> Build and deployment -> Source to GitHub Actions, then re-run this workflow." >&2
            exit 1
          fi

      - name: Prepare pinned Kawaii documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/pages/publisherstudio-kawaii-docs.zip
          EXPECTED_VERSION="$(python3 - <<'PY_VERSION'
          import re
          from pathlib import Path
          text = Path('src/PublisherStudio.Web/PublisherStudio.Web.csproj').read_text(encoding='utf-8-sig')
          match = re.search(r'<Version>\s*([^<]+?)\s*</Version>', text)
          if not match: raise SystemExit('PublisherStudio project version not found')
          print(match.group(1).strip())
          PY_VERSION
          )"
          python3 .github/scripts/prepare-pages-artifact.py \
            --archive .github/pages/publisherstudio-kawaii-docs.zip \
            --output pages-artifact \
            --expected-version "$EXPECTED_VERSION"
          test -f pages-artifact/index.html
          test -f pages-artifact/api/index.html
          test -f pages-artifact/documentation-status.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Kawaii documentation artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

      - name: Summarize artifact
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## PublisherStudio Kawaii documentation'
            echo
            echo 'The workflow publishes the tracked, version-matched, validated documentation snapshot.'
            echo
            echo '```json'
            cat pages-artifact/github-pages-deployment.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Kawaii documentation
        id: deployment
        uses: actions/deploy-pages@v4
