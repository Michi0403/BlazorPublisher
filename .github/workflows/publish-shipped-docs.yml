name: Publish PublisherStudio Kawaii documentation

on:
  push:
    paths:
      - '.github/workflows/publish-shipped-docs.yml'
      - 'build/Assert-PagesArtifact.ps1'
      - '.github/pages/publisherstudio-kawaii-docs.zip'
      - 'src/PublisherStudio.Web/PublisherStudio.Web.csproj'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publisherstudio-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Kawaii documentation
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing snapshot
        uses: actions/checkout@v6

      - name: Require GitHub Actions as the Pages publishing source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $response = & gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$env:GITHUB_REPOSITORY/pages"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Pages configuration could not be read.' }
          $pages = $response | ConvertFrom-Json
          Write-Host "PublisherStudio Pages build_type=$($pages.build_type)"
          if ($pages.build_type -ne 'workflow') { throw 'PublisherStudio Pages must use GitHub Actions rather than legacy branch publishing.' }

      - name: Prepare pinned Kawaii documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath '.github/pages/publisherstudio-kawaii-docs.zip' -PathType Leaf)) { throw 'Tracked Pages snapshot is missing.' }
          [xml]$project = Get-Content -LiteralPath 'src/PublisherStudio.Web/PublisherStudio.Web.csproj' -Raw
          $expectedVersion = @($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)[0]
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) { throw 'PublisherStudio project version is missing.' }
          & ./build/Assert-PagesArtifact.ps1 -Archive '.github/pages/publisherstudio-kawaii-docs.zip' -Output 'pages-artifact' -ExpectedVersion $expectedVersion
          foreach ($required in @('index.html','api/index.html','documentation-status.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'pages-artifact' $required) -PathType Leaf)) { throw "GitHub Pages artifact is incomplete: $required" }
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Kawaii documentation artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

      - name: Summarize artifact
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## PublisherStudio Kawaii documentation'
            echo
            echo 'The workflow publishes the tracked, version-matched, validated documentation snapshot.'
            echo
            echo '```json'
            cat pages-artifact/github-pages-deployment.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Kawaii documentation
        id: deployment
        uses: actions/deploy-pages@v4
