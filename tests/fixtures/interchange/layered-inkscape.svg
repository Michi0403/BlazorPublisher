<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="badgeClip"><circle cx="260" cy="50" r="34"/></clipPath>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Background" id="background">
    <rect id="background-fill" x="0" y="0" width="320" height="180" fill="url(#sky)"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Artwork" id="artwork" transform="translate(8 4)">
    <path id="main-path" d="M20,135 C70,30 145,30 205,135 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <g id="Badge" clip-path="url(#badgeClip)" opacity="0.85">
      <circle id="badge" cx="260" cy="50" r="42" fill="#f59e0b"/>
    </g>
    <text id="caption" x="28" y="164" font-family="sans-serif" font-size="18">Layered SVG fixture</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Hidden draft" id="hidden-layer" style="display:none">
    <polyline id="hidden-path" points="10,10 50,30 90,10" fill="none" stroke="#ef4444"/>
  </g>
</svg>
